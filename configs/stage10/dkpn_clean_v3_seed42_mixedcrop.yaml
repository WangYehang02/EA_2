# DKPN clean v3 seed42 mixed-crop. Random init. A-loss only. 3 virtual-epoch pilot.
# Do not load v2 checkpoints. Do not auto-continue to 30 epochs.
run_name: dkpn_clean_v3_seed42_mixedcrop
seed: 42
init: random
refuse_instance_pretrained: true
refuse_v2_checkpoint: true
refuse_buggy_seed42_resume: true
loss: current_partial_label_nll
phase_balanced_loss: false
max_epoch: 30
pilot_virtual_epochs: 3
hard_stop_after_pilot: true
never_auto_continue_30: true
crop_cycle_len: 3
mixed_crop: hash_trace_plus_epoch_mod_3
min_gpus: 4
preferred_gpus: 8
# DataParallel global batch; 8 per GPU x 4 GPUs
batch_size: 32
workers: 4
lr: 0.001
weight_decay: 0.0
patience: 8
lr_scheduler: ReduceLROnPlateau
lr_factor: 0.5
lr_patience: 3
val_traces: 512
val_crop: s_centered
val_every_epoch_crops: true
online_crop_scheduling: true
noise_ratio: 0.2
sigma_s: 0.1
in_samples: 3001
amp: true
official_height: 0.2
pilot_hard_threshold: 0.2
never_substitute_calibrated_threshold: true
out_dir: /data/mnt_data/yehang/PSdetec/Earthquake_stage10/dkpn_clean_v3_seed42_mixedcrop
v2_frozen_dir: /data/mnt_data/yehang/PSdetec/Earthquake_stage10/dkpn_clean_v2_seed42
legacy_buggy_dir: /data/mnt_data/yehang/PSdetec/Earthquake_stage10/dkpn_clean/train_seed42
confirm_read: false
