# Stage 6 Phase A FULL — ID-A seed42 on complete INSTANCE picker_train (8× DDP)
variant: ID-A
seed: 42
init_weight: stead
# data
index_dir: artifacts/index_full
splits_dir: artifacts/results/stage6/splits_full
use_ps_both_only: true
include_p_only: false
noise_ratio: 0.2
use_all_picker_train_ps_traces: true
component_order: ZNE  # HDF5 ENZ remapped in LazyPhaseNetCropDataset
# optimization
epochs: 50
early_stopping_patience: 8
batch_size: 24
lr: 1.0e-4
weight_decay: 1.0e-4
grad_clip: 1.0
# AMP fp16 caused NaN within ~10–20 steps on PhaseNet+INSTANCE; use fp32.
amp: false
skip_nonfinite_batches: true
input_clip: 50.0
warmup_epochs: 2
cosine_scheduler: true
workers: 2
# BN / checkpoint
bn_policy: eval_frozen_running_stats
checkpoint_metric: s_f1@0.5
annotate_eval_every_epoch: true
annotate_eval_max_traces: 1024
final_annotate_full_dev: true
# labels
sigma_s: 0.1
label_order: PSN
# aug
aug_noise_std: 0.02
aug_channel_dropout_prob: 0.05
aug_polarity_flip_prob: 0.1
aug_amp_scale_min: 0.5
aug_amp_scale_max: 1.5
# outputs
out_dir: artifacts/models/stage6/phasenet_ida_full_seed42
refuse_instance_pretrained: true
smoke: false
role_label: stage6_phaseA_full_instance
