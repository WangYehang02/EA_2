# Tiny DDP smoke for full protocol gate
variant: ID-A-smoke-full
seed: 0
init_weight: stead
index_dir: artifacts/index_full
splits_dir: artifacts/results/stage6/splits_full
use_ps_both_only: true
include_p_only: false
noise_ratio: 0.1
use_all_picker_train_ps_traces: false
n_train_events: 64
n_dev_traces: 64
n_train_noise: 32
epochs: 1
early_stopping_patience: 1
batch_size: 8
lr: 1.0e-4
weight_decay: 1.0e-4
grad_clip: 1.0
amp: true
warmup_epochs: 0
cosine_scheduler: false
workers: 2
bn_policy: eval_frozen_running_stats
checkpoint_metric: s_f1@0.5
annotate_eval_every_epoch: true
annotate_eval_max_traces: 32
final_annotate_full_dev: false
sigma_s: 0.1
label_order: PSN
out_dir: artifacts/models/stage6/phasenet_full_ddp_smoke
refuse_instance_pretrained: true
smoke: true
role_label: stage6_phaseA_full_ddp_smoke
