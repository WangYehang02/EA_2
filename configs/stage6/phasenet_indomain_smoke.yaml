# Stage 6 Phase A smoke (tiny)
variant: ID-A-smoke
seed: 0
init_weight: stead
device: cuda:1
picker_train_list: artifacts/results/stage6/splits/stage6_picker_train_traces.txt
dev_list: artifacts/results/stage6/splits/stage6_dev_traces.txt
use_all_picker_train_traces: false
n_train_traces: 256
n_dev_traces: 128
n_train_noise: 64
noise_ratio: 0.2
epochs: 2
early_stopping_patience: 2
batch_size: 8
lr: 1.0e-4
weight_decay: 1.0e-4
grad_clip: 1.0
amp: false
warmup_epochs: 0
cosine_scheduler: true
bn_policy: eval_frozen_running_stats
checkpoint_metric: s_f1@0.5
annotate_eval_every_epoch: true
annotate_eval_max_traces: 64
final_annotate_full_dev: false
sigma_s: 0.1
label_order: PSN
out_dir: artifacts/models/stage6/phasenet_smoke
refuse_instance_pretrained: true
smoke: true
